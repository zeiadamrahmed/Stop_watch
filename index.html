<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Stopwatch</title>
    <!-- MDB icon -->
    <link rel="icon" href="./img/alarm-clock-solid.png" type="image/x-icon" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <!-- MDB -->
    <link rel="stylesheet" href="css/mdb.min.css" />
    <!-- icon mdb -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- Background image -->
    <div
      class="bg-image d-flex justify-content-center align-items-center"
      style="
        background-image: url(./img/Gemini_Generated_Image_kkr2wfkkr2wfkkr2.jpg);
        min-height: 100vh;
      "
    >
      <div class="container">
        <div class="row g-4">
          <!-- الساعة -->
          <div class="col-lg-4">
            <div class="main-card text-center">
              <div class="clock">
                <span class="clock-number n12">12</span>
                <span class="clock-number n1">1</span>
                <span class="clock-number n2">2</span>
                <span class="clock-number n3">3</span>
                <span class="clock-number n4">4</span>
                <span class="clock-number n5">5</span>
                <span class="clock-number n6">6</span>
                <span class="clock-number n7">7</span>
                <span class="clock-number n8">8</span>
                <span class="clock-number n9">9</span>
                <span class="clock-number n10">10</span>
                <span class="clock-number n11">11</span>

                <div class="hand hour" id="hour"></div>
                <div class="hand minute" id="minut"></div>
                <div class="hand second" id="second"></div>
                <div class="dot"></div>
              </div>

              <div class="digital-time" id="digitalTime">12:00:00 AM</div>
              <p class="small-muted mt-2" id="dateText"></p>
            </div>
          </div>

          <!-- الستوب واتش -->
          <div class="col-lg-8">
            <div class="main-card stop text-center">
              <div class="d-flex flex-column flex-md-row gap-2 w-100 mb-3">
                <select id="reciter" class="form-select text-truncate"></select>
                <select id="surah" class="form-select text-truncate"></select>
              </div>
              <h1 class="text" id="time">00:00:00:00</h1>
              <div class="d-flex flex-wrap justify-content-center gap-2">
                <button
                  class="btn btn-primary btn-rounded"
                  onclick="startWithSound()"
                  data-mdb-ripple-init
                >
                  Start
                </button>

                <button
                  id="stopBtn"
                  class="btn btn-danger btn-rounded"
                  onclick="toggleStop()"
                >
                  Stop
                </button>

                <button
                  class="btn btn-warning btn-rounded"
                  onclick="reset()"
                  data-mdb-ripple-init
                >
                  Reset
                </button>

                <button
                  id="save"
                  class="btn btn-success btn-rounded"
                  onclick="saveTime()"
                >
                  Save
                </button>
              </div>
              <ul id="savedTimes"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MDB -->
    <script type="text/javascript" src="js/mdb.umd.min.js"></script>
    <!-- Custom scripts -->
    <script type="text/javascript"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
